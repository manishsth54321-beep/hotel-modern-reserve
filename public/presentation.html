let current = 0;
const total = slides.length;

function render() {
  document.getElementById('slides').innerHTML = '<div class="container"><div class="inner">' + slides[current].html + '</div></div>';
  document.getElementById('slideNum').textContent = (current + 1) + ' / ' + total;
  document.getElementById('progressBar').style.width = ((current + 1) / total * 100) + '%';
}

function next() { if (current < total - 1) { current++; render(); } }
function prev() { if (current > 0) { current--; render(); } }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); prev(); }
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

render();
</script>
</body>
</html>
